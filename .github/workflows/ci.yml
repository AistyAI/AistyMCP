name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import every module
        # Catches import-time breakage in modules the tests do not reach.
        run: |
          python - <<'PY'
          import importlib, pkgutil
          import aistymcp

          failed = []
          for mod in pkgutil.walk_packages(aistymcp.__path__, "aistymcp."):
              try:
                  importlib.import_module(mod.name)
              except Exception as exc:
                  failed.append((mod.name, exc))

          for name, exc in failed:
              print("FAILED {}: {!r}".format(name, exc))
          raise SystemExit(1 if failed else 0)
          PY

      - name: Test
        run: pytest -v
